<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳清鋒SDGs 性別平權-情境題 (第二關)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
        
        * {
            font-family: 'Zen Maru Gothic', sans-serif, system-ui;
            user-select: none;
        }

        /* Animated Background & Sky Elements */
        .sky-bg {
            background: linear-gradient(to bottom, #7dd3fc, #e0f2fe 60%, #bae6fd);
        }

        /* Ferris Wheel Animation */
        @keyframes rotate-wheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-ferris {
            animation: rotate-wheel 40s linear infinite;
            transform-origin: center center;
        }

        /* Cloud Float Animation */
        @keyframes float-cloud {
            0% { transform: translateX(-10%); }
            50% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }
        .animate-cloud-1 { animation: float-cloud 25s ease-in-out infinite; }
        .animate-cloud-2 { animation: float-cloud 35s ease-in-out infinite reverse; }

        /* Flower Bounce Animation */
        @keyframes flower-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.08); }
        }
        .flower-item {
            animation: flower-bounce 3s ease-in-out infinite;
            cursor: pointer;
            transition: filter 0.3s, transform 0.2s;
        }
        .flower-item:hover {
            filter: drop-shadow(0 0 15px rgba(255, 230, 0, 0.9));
        }

        /* Drag & Drop Styles */
        .draggable-item {
            cursor: grab;
            transition: all 0.2s ease;
        }
        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.03);
        }
        .drop-zone {
            transition: border-color 0.2s, background-color 0.2s;
        }
        .drop-zone.drag-over {
            background-color: rgba(254, 240, 138, 0.4);
            border-color: #f59e0b;
        }

        /* Glassmorphic UI Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden sky-bg flex flex-col justify-between">

    <!-- TOP HEADER BAR -->
    <header class="absolute top-0 left-0 right-0 z-20 flex justify-between items-center px-4 py-3 sm:px-8 sm:py-4 bg-white/70 backdrop-blur-md shadow-sm border-b border-white/50">
        <!-- Top-Left Title -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white text-xl shadow-md">
                <i class="fa-solid fa-venus-mars"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-2xl font-black text-slate-800 tracking-wide">
                    吳清鋒SDGs 性別平權-情境題
                </h1>
                <span class="text-xs sm:text-sm text-pink-600 font-bold bg-pink-100 px-2 py-0.5 rounded-full">關卡 2：遊樂園探索</span>
            </div>
        </div>

        <!-- Top-Right Score Counter -->
        <div class="flex items-center bg-amber-100 border-2 border-amber-300 rounded-2xl px-4 py-2 shadow-inner">
            <i class="fa-solid fa-star text-amber-500 text-xl mr-2 animate-bounce"></i>
            <span class="text-sm sm:text-base font-bold text-amber-900">答對題數：</span>
            <span id="score-text" class="text-xl sm:text-2xl font-black text-amber-600 ml-1">0</span>
            <span class="text-sm font-bold text-amber-700 ml-0.5">/ 6</span>
        </div>
    </header>

    <!-- AMUSEMENT PARK BACKGROUND (SVG & SCENERY) -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        
        <!-- Clouds -->
        <svg class="absolute top-16 left-10 w-48 text-white/80 animate-cloud-1" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
        <svg class="absolute top-28 right-20 w-64 text-white/70 animate-cloud-2" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>

        <!-- Ferris Wheel Right Side -->
        <div class="absolute right-6 bottom-32 sm:right-16 sm:bottom-40 opacity-90">
            <svg class="w-56 h-56 sm:w-80 sm:h-80" viewBox="0 0 200 200">
                <!-- Stand -->
                <polygon points="100,100 60,195 140,195" fill="none" stroke="#64748b" stroke-width="6"/>
                <!-- Rotating Wheel Group -->
                <g class="animate-ferris">
                    <circle cx="100" cy="100" r="80" fill="none" stroke="#f43f5e" stroke-width="5"/>
                    <circle cx="100" cy="100" r="50" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6"/>
                    <!-- Spokes -->
                    <line x1="100" y1="20" x2="100" y2="180" stroke="#f43f5e" stroke-width="3"/>
                    <line x1="20" y1="100" x2="180" y2="100" stroke="#f43f5e" stroke-width="3"/>
                    <line x1="43.4" y1="43.4" x2="156.6" y2="156.6" stroke="#f43f5e" stroke-width="3"/>
                    <line x1="156.6" y1="43.4" x2="43.4" y2="156.6" stroke="#f43f5e" stroke-width="3"/>
                    <!-- Cabins -->
                    <circle cx="100" cy="20" r="9" fill="#06b6d4"/>
                    <circle cx="180" cy="100" r="9" fill="#10b981"/>
                    <circle cx="100" cy="180" r="9" fill="#8b5cf6"/>
                    <circle cx="20" cy="100" r="9" fill="#f59e0b"/>
                    <circle cx="156.6" cy="43.4" r="9" fill="#ec4899"/>
                    <circle cx="43.4" cy="156.6" r="9" fill="#84cc16"/>
                    <circle cx="156.6" cy="156.6" r="9" fill="#3b82f6"/>
                    <circle cx="43.4" cy="43.4" r="9" fill="#f97316"/>
                </g>
                <circle cx="100" cy="100" r="10" fill="#475569"/>
            </svg>
        </div>

        <!-- Roller Coaster Tracks Left Side -->
        <div class="absolute left-0 bottom-28 sm:bottom-36 opacity-75">
            <svg class="w-80 h-40 sm:w-96 sm:h-48" viewBox="0 0 300 150">
                <path d="M 0,130 Q 70,10 130,90 T 260,40 Q 290,20 300,50" fill="none" stroke="#ec4899" stroke-width="5"/>
                <path d="M 0,138 Q 70,18 130,98 T 260,48 Q 290,28 300,58" fill="none" stroke="#be185d" stroke-width="2"/>
                <!-- Support Beams -->
                <line x1="70" y1="65" x2="70" y2="150" stroke="#94a3b8" stroke-width="3"/>
                <line x1="130" y1="90" x2="130" y2="150" stroke="#94a3b8" stroke-width="3"/>
                <line x1="200" y1="65" x2="200" y2="150" stroke="#94a3b8" stroke-width="3"/>
            </svg>
        </div>

        <!-- Carnival Tents & Carousel Center -->
        <div class="absolute left-1/2 transform -translate-x-1/2 bottom-24 sm:bottom-32 flex items-end space-x-4 opacity-85">
            <!-- Circus Tent -->
            <svg class="w-32 h-32 sm:w-44 sm:h-44" viewBox="0 0 100 100">
                <polygon points="50,10 10,50 90,50" fill="#ef4444"/>
                <polygon points="50,10 30,50 50,50" fill="#ffffff"/>
                <polygon points="50,10 70,50 50,50" fill="#ffffff"/>
                <rect x="20" y="50" width="60" height="40" fill="#facc15"/>
                <path d="M 40,90 A 10,10 0 0 1 60,90 Z" fill="#1e293b"/>
                <polygon points="50,0 50,10 60,5" fill="#3b82f6"/>
            </svg>
        </div>

        <!-- Green Hills Base (Lower Half Area) -->
        <div class="absolute bottom-0 left-0 right-0 h-1/2 bg-gradient-to-t from-emerald-600 via-green-500 to-transparent -z-10"></div>
        <div class="absolute bottom-0 left-0 right-0 h-1/3 bg-emerald-600 rounded-t-[50%_20%] scale-x-110 shadow-lg"></div>
    </div>

    <!-- MAIN GAME AREA (FLOWER CONTAINER) -->
    <main id="flower-container" class="relative w-full h-full z-10 pointer-events-none">
        <!-- Flowers will be injected dynamically into the lower half via JS -->
    </main>

    <!-- INSTRUCTION BANNER -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 bg-white/90 backdrop-blur-md px-6 py-2.5 rounded-full shadow-lg border border-emerald-300 text-slate-700 text-xs sm:text-sm font-bold flex items-center space-x-2">
        <i class="fa-solid fa-circle-info text-emerald-500 text-base"></i>
        <span>點擊下方的花朵探索情境題（共 3 朵，6 個觀念）</span>
    </div>

    <!-- QUESTION MODAL (DRAG AND DROP) -->
    <div id="question-modal" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
        <div class="glass-panel w-full max-w-3xl rounded-3xl p-5 sm:p-7 shadow-2xl flex flex-col max-h-[92vh] overflow-y-auto transform transition-all scale-95 opacity-0" id="modal-card">
            
            <!-- Modal Header -->
            <div class="flex justify-between items-center border-b border-slate-200/80 pb-3 mb-4">
                <div class="flex items-center space-x-3">
                    <span id="modal-flower-icon" class="text-3xl">🌸</span>
                    <div>
                        <h2 id="modal-title" class="text-xl sm:text-2xl font-black text-slate-800">情境挑戰題組</h2>
                        <p class="text-xs sm:text-sm text-slate-500 font-bold">請將下列語句/行為拖曳至正確的分類框中</p>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Draggable Source Items -->
            <div class="mb-5">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">請分配以下 2 個題目：</h3>
                <div id="items-pool" class="grid grid-cols-1 gap-3 min-h-[90px]">
                    <!-- Items rendered dynamically -->
                </div>
            </div>

            <!-- Target Drop Zones -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <!-- Drop Zone 1: 性別平等 -->
                <div id="zone-equality" data-target="equality" class="drop-zone border-3 border-dashed border-emerald-400 bg-emerald-50/70 rounded-2xl p-4 flex flex-col min-h-[160px]">
                    <div class="flex items-center space-x-2 text-emerald-700 font-black mb-3 border-b border-emerald-200 pb-2">
                        <i class="fa-solid fa-scale-balanced text-xl"></i>
                        <span>性別平等 (Gender Equality)</span>
                    </div>
                    <div class="dropped-container flex-1 flex flex-col gap-2">
                        <!-- Dropped elements appear here -->
                    </div>
                </div>

                <!-- Drop Zone 2: 性別不平等 -->
                <div id="zone-inequality" data-target="inequality" class="drop-zone border-3 border-dashed border-rose-400 bg-rose-50/70 rounded-2xl p-4 flex flex-col min-h-[160px]">
                    <div class="flex items-center space-x-2 text-rose-700 font-black mb-3 border-b border-rose-200 pb-2">
                        <i class="fa-solid fa-ban text-xl"></i>
                        <span>性別不平等 (Gender Inequality)</span>
                    </div>
                    <div class="dropped-container flex-1 flex flex-col gap-2">
                        <!-- Dropped elements appear here -->
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end pt-2">
                <button id="btn-submit-group" onclick="submitCurrentGroup()" class="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-lg rounded-2xl shadow-lg shadow-orange-500/30 transform active:scale-95 transition flex items-center justify-center space-x-2">
                    <span>確認送出答題</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- RESULT & END GAME MODAL -->
    <div id="result-modal" class="hidden fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-8 shadow-2xl text-center transform transition-all scale-90 opacity-0 flex flex-col items-center" id="result-card">
            
            <!-- Result Badge / Icon -->
            <div id="result-badge-container" class="w-24 h-24 rounded-full flex items-center justify-center text-5xl mb-4 shadow-xl border-4 border-white">
                🏆
            </div>

            <h3 class="text-sm font-bold text-slate-400 tracking-widest uppercase mb-1">闖關評級結果</h3>
            <h2 id="result-level-name" class="text-3xl sm:text-4xl font-black mb-3 text-slate-800">平權達人</h2>
            
            <p id="result-description" class="text-slate-600 font-bold mb-6 text-sm sm:text-base px-4">
                太棒了！您具備極佳的性別平權觀念，成功通過所有情境考驗！
            </p>

            <div class="bg-amber-50 border border-amber-200 rounded-2xl py-3 px-6 mb-6 w-full flex justify-around items-center">
                <div>
                    <span class="text-xs text-slate-500 font-bold block">總題數</span>
                    <span class="text-lg font-black text-slate-700">6 題</span>
                </div>
                <div class="h-8 w-px bg-amber-200"></div>
                <div>
                    <span class="text-xs text-slate-500 font-bold block">答對數</span>
                    <span id="result-score" class="text-2xl font-black text-amber-600">6 題</span>
                </div>
            </div>

            <!-- Action Buttons Dynamic Insertion -->
            <div id="result-actions" class="w-full flex justify-center">
                <!-- Dynamically generated "再次挑戰" or "下載學習證書" -->
            </div>
        </div>
    </div>

    <!-- HIDDEN CANVAS FOR CERTIFICATE GENERATION -->
    <canvas id="cert-canvas" width="800" height="600" class="hidden"></canvas>

    <!-- AUDIO SYNTHESIS & GAME LOGIC SCRIPT -->
    <script>
        // --- SOUND EFFECTS (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'drop') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    // Win chime
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, now + index * 0.12);
                        g.gain.linearRampToValueAtTime(0.01, now + index * 0.12 + 0.3);
                        o.start(now + index * 0.12);
                        o.stop(now + index * 0.12 + 0.3);
                    });
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        // --- GAME DATA & STATE ---
        const flowerGroups = [
            {
                id: 1,
                name: "花朵 1 - 家庭與觀念題組",
                color: "from-pink-400 to-rose-500",
                icon: "🌸",
                questions: [
                    { id: 'q1', text: "家事與照顧小孩由父母共同分擔", type: "equality" },
                    { id: 'q2', text: "認為男孩子哭泣就是軟弱沒有用", type: "inequality" }
                ],
                completed: false
            },
            {
                id: 2,
                name: "花朵 2 - 職場與薪資題組",
                color: "from-amber-400 to-orange-500",
                icon: "🌻",
                questions: [
                    { id: 'q3', text: "不論性別，只要能力符合皆可擔任高階主管", type: "equality" },
                    { id: 'q4', text: "給予女性員工較低的薪資因為以後會結婚生子", type: "inequality" }
                ],
                completed: false
            },
            {
                id: 3,
                name: "花朵 3 - 教育與玩具題組",
                color: "from-purple-400 to-indigo-500",
                icon: "🌷",
                questions: [
                    { id: 'q5', text: "鼓勵男生選擇家政課，女生選擇工藝課", type: "equality" },
                    { id: 'q6', text: "玩具區分為『男童專用』與『女童專用』", type: "inequality" }
                ],
                completed: false
            }
        ];

        let activeGroupId = null;
        let userAssignments = {}; // Stores { questionId: 'equality' | 'inequality' }
        let totalCorrect = 0;

        // --- INITIALIZATION & FLOWER RANDOMIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });

        function initGame() {
            totalCorrect = 0;
            updateScoreUI();
            userAssignments = {};
            flowerGroups.forEach(g => g.completed = false);

            const container = document.getElementById('flower-container');
            container.innerHTML = '';

            // Randomize positions in the lower half (Y: 55% to 82%, X: 15% to 80%)
            // Ensure flowers don't overlap too much by using 3 horizontal slots
            const slots = [
                { minX: 12, maxX: 32 },
                { minX: 40, maxX: 60 },
                { minX: 68, maxX: 85 }
            ];

            // Shuffle slots array so flowers get different layout distributions
            const shuffledSlots = [...slots].sort(() => Math.random() - 0.5);

            flowerGroups.forEach((group, index) => {
                const slot = shuffledSlots[index];
                const posX = Math.floor(Math.random() * (slot.maxX - slot.minX)) + slot.minX;
                const posY = Math.floor(Math.random() * (82 - 58)) + 58; // 58% ~ 82% from top

                const flowerEl = document.createElement('div');
                flowerEl.id = `flower-btn-${group.id}`;
                flowerEl.className = `flower-item absolute pointer-events-auto flex flex-col items-center group cursor-pointer`;
                flowerEl.style.left = `${posX}%`;
                flowerEl.style.top = `${posY}%`;
                flowerEl.onclick = () => openModal(group.id);

                flowerEl.innerHTML = `
                    <div class="relative flex items-center justify-center">
                        <div class="absolute inset-0 bg-white/40 rounded-full blur-md group-hover:bg-yellow-300/60 transition"></div>
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr ${group.color} shadow-lg border-4 border-white flex items-center justify-center text-3xl sm:text-4xl text-white transform transition group-hover:scale-110">
                            ${group.icon}
                        </div>
                        <span id="badge-${group.id}" class="hidden absolute -top-2 -right-2 bg-emerald-500 text-white w-7 h-7 rounded-full text-xs font-black border-2 border-white flex items-center justify-center shadow">
                            ✓
                        </span>
                    </div>
                    <div class="mt-2 bg-white/90 backdrop-blur-md px-3 py-1 rounded-xl shadow border border-slate-200 text-xs sm:text-sm font-black text-slate-700 whitespace-nowrap">
                        ${group.name.split(' - ')[1]}
                    </div>
                `;

                container.appendChild(flowerEl);
            });

            setupDragAndDropHandlers();
        }

        // --- MODAL & DRAG/DROP SYSTEM ---
        function openModal(groupId) {
            playSound('click');
            const group = flowerGroups.find(g => g.id === groupId);
            if (!group) return;

            activeGroupId = groupId;
            document.getElementById('modal-title').innerText = group.name;
            document.getElementById('modal-flower-icon').innerText = group.icon;

            // Clear previous items in drop zones
            document.querySelector('#zone-equality .dropped-container').innerHTML = '';
            document.querySelector('#zone-inequality .dropped-container').innerHTML = '';

            const itemsPool = document.getElementById('items-pool');
            itemsPool.innerHTML = '';

            // Populate source items (or restore dropped state if already answered)
            group.questions.forEach(q => {
                const itemEl = createDraggableItem(q);
                
                const assignedZone = userAssignments[q.id];
                if (assignedZone) {
                    document.querySelector(`#zone-${assignedZone} .dropped-container`).appendChild(itemEl);
                } else {
                    itemsPool.appendChild(itemEl);
                }
            });

            const modal = document.getElementById('question-modal');
            const card = document.getElementById('modal-card');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            playSound('click');
            const modal = document.getElementById('question-modal');
            const card = document.getElementById('modal-card');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function createDraggableItem(q) {
            const div = document.createElement('div');
            div.id = `item-${q.id}`;
            div.dataset.qid = q.id;
            div.draggable = true;
            div.className = `draggable-item bg-white p-3 sm:p-4 rounded-xl border-2 border-slate-200 shadow-sm flex items-center justify-between space-x-3 text-slate-800 font-bold text-sm sm:text-base`;
            
            div.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-grip-vertical text-slate-400"></i>
                    <span>${q.text}</span>
                </div>
                <div class="quick-assign flex space-x-1 sm:hidden">
                    <button type="button" onclick="quickMove('${q.id}', 'equality')" class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-xs">平權</button>
                    <button type="button" onclick="quickMove('${q.id}', 'inequality')" class="px-2 py-1 bg-rose-100 text-rose-700 rounded text-xs">不平權</button>
                </div>
            `;

            // HTML5 Drag Events
            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', q.id);
                div.classList.add('opacity-50');
            });

            div.addEventListener('dragend', () => {
                div.classList.remove('opacity-50');
            });

            return div;
        }

        function setupDragAndDropHandlers() {
            const zones = document.querySelectorAll('.drop-zone');
            
            zones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    const qId = e.dataTransfer.getData('text/plain');
                    if (!qId) return;

                    const itemEl = document.getElementById(`item-${qId}`);
                    const targetType = zone.dataset.target;

                    if (itemEl && targetType) {
                        zone.querySelector('.dropped-container').appendChild(itemEl);
                        userAssignments[qId] = targetType;
                        playSound('drop');
                    }
                });
            });
        }

        // Mobile fallback for quick clicking instead of drag-and-drop
        function quickMove(qId, targetType) {
            const itemEl = document.getElementById(`item-${qId}`);
            if (itemEl) {
                document.querySelector(`#zone-${targetType} .dropped-container`).appendChild(itemEl);
                userAssignments[qId] = targetType;
                playSound('drop');
            }
        }

        // --- SUBMIT GROUP LOGIC ---
        function submitCurrentGroup() {
            const group = flowerGroups.find(g => g.id === activeGroupId);
            if (!group) return;

            // Check if both questions in current group are assigned
            const qIds = group.questions.map(q => q.id);
            const allAssigned = qIds.every(id => userAssignments[id]);

            if (!allAssigned) {
                playSound('wrong');
                alert('請先將本題組的 2 個觀念全部分配到分類框中喔！');
                return;
            }

            // Calculate correctness for this group
            let groupCorrect = 0;
            group.questions.forEach(q => {
                if (userAssignments[q.id] === q.type) {
                    groupCorrect++;
                }
            });

            group.completed = true;

            // Update Flower UI Badge
            const badge = document.getElementById(`badge-${group.id}`);
            if (badge) badge.classList.remove('hidden');

            closeModal();
            playSound('correct');

            // Update Total Score
            calculateTotalScore();

            // Check if all 3 flowers are done
            const allGroupsDone = flowerGroups.every(g => g.completed);
            if (allGroupsDone) {
                setTimeout(() => {
                    showFinalResult();
                }, 500);
            }
        }

        function calculateTotalScore() {
            let correct = 0;
            flowerGroups.forEach(g => {
                g.questions.forEach(q => {
                    if (userAssignments[q.id] === q.type) {
                        correct++;
                    }
                });
            });
            totalCorrect = correct;
            updateScoreUI();
        }

        function updateScoreUI() {
            document.getElementById('score-text').innerText = totalCorrect;
        }

        // --- END GAME & CERTIFICATE GENERATION ---
        function showFinalResult() {
            const modal = document.getElementById('result-modal');
            const card = document.getElementById('result-card');
            const badgeContainer = document.getElementById('result-badge-container');
            const levelNameEl = document.getElementById('result-level-name');
            const descEl = document.getElementById('result-description');
            const scoreEl = document.getElementById('result-score');
            const actionsEl = document.getElementById('result-actions');

            scoreEl.innerText = `${totalCorrect} / 6`;

            let levelName = "";
            let description = "";
            let badgeBg = "";
            let icon = "";
            let isMaster = false;

            if (totalCorrect === 6) {
                levelName = "平權達人";
                description = "完美！您完全掌握了 SDGs 性別平等核心精神，建立包容且尊重的平權關懷！";
                badgeBg = "bg-gradient-to-tr from-amber-400 to-yellow-300 text-amber-900 border-yellow-200";
                icon = "👑";
                isMaster = true;
                playSound('win');
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            } else if (totalCorrect >= 4) {
                levelName = "進步中";
                description = "表現不錯！您已具備良好的平權觀念，再嘗試一次爭取「平權達人」滿分認證吧！";
                badgeBg = "bg-gradient-to-tr from-blue-400 to-cyan-300 text-blue-900 border-blue-200";
                icon = "🌟";
                playSound('correct');
            } else {
                levelName = "再加油";
                description = "別灰心！性別平權需要多觀察與體諒，重新挑戰強化學習觀念吧！";
                badgeBg = "bg-gradient-to-tr from-rose-400 to-pink-300 text-rose-900 border-rose-200";
                icon = "💪";
                playSound('wrong');
            }

            badgeContainer.className = `w-24 h-24 rounded-full flex items-center justify-center text-5xl mb-4 shadow-xl ${badgeBg}`;
            badgeContainer.innerText = icon;
            levelNameEl.innerText = levelName;
            descEl.innerText = description;

            // Generate Action Button
            if (isMaster) {
                actionsEl.innerHTML = `
                    <button onclick="downloadCertificate()" class="w-full py-3.5 px-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black rounded-2xl shadow-lg shadow-teal-500/30 flex items-center justify-center space-x-2 transform active:scale-95 transition">
                        <i class="fa-solid fa-award text-xl"></i>
                        <span>下載學習證書</span>
                    </button>
                `;
            } else {
                actionsEl.innerHTML = `
                    <button onclick="restartGame()" class="w-full py-3.5 px-6 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black rounded-2xl shadow-lg shadow-indigo-500/30 flex items-center justify-center space-x-2 transform active:scale-95 transition">
                        <i class="fa-solid fa-rotate-right text-xl"></i>
                        <span>再次挑戰</span>
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-90', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function restartGame() {
            playSound('click');
            const modal = document.getElementById('result-modal');
            const card = document.getElementById('result-card');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                initGame();
            }, 200);
        }

        // --- DRAW AND DOWNLOAD CERTIFICATE CANVAS ---
        function downloadCertificate() {
            playSound('win');
            const canvas = document.getElementById('cert-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            // Background Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, width, height);
            bgGrad.addColorStop(0, '#fffbe5');
            bgGrad.addColorStop(1, '#fef3c7');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Certificate Border
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 12;
            ctx.strokeRect(20, 20, width - 40, height - 40);

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 4;
            ctx.strokeRect(32, 32, width - 64, height - 64);

            // Title Header
            ctx.fillStyle = '#92400e';
            ctx.font = 'bold 34px "Zen Maru Gothic", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('吳清鋒SDGs 性別平權學習證書', width / 2, 100);

            // Subtitle
            ctx.fillStyle = '#b45309';
            ctx.font = 'bold 20px "Zen Maru Gothic", sans-serif';
            ctx.fillText('SDG 5 性別平等 - 第二關情境題通關證明', width / 2, 140);

            // Divider Line
            ctx.beginPath();
            ctx.moveTo(150, 165);
            ctx.lineTo(650, 165);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Body Content
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 22px "Zen Maru Gothic", sans-serif';
            ctx.fillText('恭喜挑戰者：優秀平權探索家', width / 2, 230);

            ctx.fillStyle = '#475569';
            ctx.font = '18px "Zen Maru Gothic", sans-serif';
            const bodyMsg = '參加「吳清鋒SDGs 性別平權-情境題」學習關卡，';
            const bodyMsg2 = '展現極佳的性別平權判斷力與包容理解，特頒此證以資鼓勵！';
            ctx.fillText(bodyMsg, width / 2, 280);
            ctx.fillText(bodyMsg2, width / 2, 315);

            // Result Badge Stamp
            ctx.save();
            ctx.translate(width / 2, 420);
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Zen Maru Gothic", sans-serif';
            ctx.fillText('平權達人', 0, 8);
            ctx.font = '14px "Zen Maru Gothic", sans-serif';
            ctx.fillText('FULL SCORE', 0, 30);
            ctx.restore();

            // Date & Footer
            const today = new Date();
            const dateStr = `發證日期：${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;
            ctx.fillStyle = '#64748b';
            ctx.font = '16px "Zen Maru Gothic", sans-serif';
            ctx.fillText(dateStr, width / 2, 530);

            // Export to Image & Trigger Download
            const link = document.createElement('a');
            link.download = `吳清鋒SDGs_性別平權_學習證書.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
